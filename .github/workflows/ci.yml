name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: feedbacklens
          POSTGRES_PASSWORD: feedbacklens
          POSTGRES_DB: feedbacklens
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U feedbacklens -d feedbacklens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://feedbacklens:feedbacklens@localhost:5434/feedbacklens
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest
      - name: Eval regression check
        run: |
          uv run python -m app.evals score \
            --workspace demo \
            --baseline ../../evals/baselines/demo.json \
            --json ../../evals/latest.json \
            --max-drop 3.0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
