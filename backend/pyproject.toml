[project]
name = "feedbacklens-backend"
version = "0.1.0"
description = "FeedbackLens API and background worker"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
local-embeddings = [
    "fastembed>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
